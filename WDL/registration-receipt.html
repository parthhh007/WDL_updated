<div class="section">
  <h1> <mark style="background-color: IndianRed; color: white"> Registration Receipt </mark></h1>

  <script>
    if (record === null) {
      document.write("<p>No registration found yet. Please <a href='patient-registration.html'>register a patient</a> first.</p>");
    } else {
      // Fee receipt printed with document.write()
      document.write("<h2>Fee Details</h2>");
      document.write("<table class='detail-table'>");
      printRow("Patient Name", record.patientName);
      printRow("Patient ID", record.patientId);
      printRow("Consultation Fee", "Rs. " + record.consultationFee);
      printRow("Registration Fee", "Rs. " + record.registrationFee);
      if (record.seniorEligible) {
        printRow("Senior Citizen Discount", "- Rs. " + record.discount);
      }
      printRow("Total Amount Payable", "Rs. " + record.total, "total-amount");
      printRow("Registration Status", record.status);
      document.write("</table>");

      // Patient object methods
      document.write("<h2>Patient Information</h2>");
      patient.displayPatient();
      document.write("<h2>Appointment Details</h2>");
      patient.displayAppointment();

      document.write("<a class='back-link' href='patient-registration.html'>Register another patient</a>");
    }
  </script>
